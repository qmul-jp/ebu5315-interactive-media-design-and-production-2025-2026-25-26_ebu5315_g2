<svg viewBox="0 0 1600 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F4E6"></stop>
      <stop offset="1" stop-color="#D3EECF"></stop>
    </linearGradient>

    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3F0FF"></stop>
      <stop offset="1" stop-color="#D2E6F9"></stop>
    </linearGradient>

    <linearGradient id="toolGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE8B0"></stop>
      <stop offset="1" stop-color="#F6D383"></stop>
    </linearGradient>

    <linearGradient id="crystalBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5E7FF"></stop>
      <stop offset="1" stop-color="#7FCFFF"></stop>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景草坡 -->
  <path d="M0 188C150 150 320 152 500 182C680 212 860 212 1030 184C1210 154 1400 152 1600 182V260H0V188Z" fill="url(#hillA)"></path>
  <path d="M0 215C180 184 360 190 560 214C760 238 960 234 1160 208C1340 186 1480 190 1600 208V260H0V215Z" fill="url(#hillB)" opacity="0.92"></path>

  <!-- 左侧花草 -->
  <circle cx="108" cy="220" r="16" fill="#C9EAD1"></circle>
  <circle cx="92" cy="231" r="10" fill="#B9E0C0"></circle>
  <circle cx="126" cy="232" r="9" fill="#D6F0DB"></circle>

  <!-- 左侧小花 -->
  <circle cx="156" cy="218" r="8" fill="#FFF2C7"></circle>
  <circle cx="148" cy="223" r="5" fill="#FFD8E6"></circle>
  <circle cx="164" cy="223" r="5" fill="#FFD8E6"></circle>
  <circle cx="156" cy="228" r="3.5" fill="#FFE59A"></circle>

  <circle cx="190" cy="232" r="5" fill="#FFF1D0"></circle>
  <circle cx="185" cy="236" r="3" fill="#FFDCE8"></circle>
  <circle cx="194" cy="236" r="3" fill="#FFDCE8"></circle>

  <!-- 左侧几何晶体 -->
  <polygon points="70,220 88,176 108,220" fill="url(#crystalBlue)" opacity="0.9"></polygon>
  <polygon points="102,226 118,188 136,226" fill="url(#crystalBlue)" opacity="0.76"></polygon>

  <!-- 左侧量角器 -->
  <path d="M180 222A60 60 0 0 1 300 222" fill="none" stroke="url(#toolGold)" stroke-width="5" opacity="0.65"></path>
  <path d="M194 214L194 208" stroke="#EFCB79" stroke-width="2" opacity="0.55"></path>
  <path d="M212 209L213 202" stroke="#EFCB79" stroke-width="2" opacity="0.55"></path>
  <path d="M232 205L233 198" stroke="#EFCB79" stroke-width="2" opacity="0.55"></path>
  <path d="M252 205L251 198" stroke="#EFCB79" stroke-width="2" opacity="0.55"></path>
  <path d="M272 209L271 202" stroke="#EFCB79" stroke-width="2" opacity="0.55"></path>
  <path d="M288 214L288 208" stroke="#EFCB79" stroke-width="2" opacity="0.55"></path>

  <!-- 中间切线轨迹 -->
  <path d="M420 188C560 154 760 150 940 176C1080 196 1160 186 1250 160" fill="none" stroke="#F5DFA6" stroke-width="3" opacity="0.5" stroke-linecap="round"></path>

  <!-- 辅助圆弧 -->
  <path d="M520 214C650 180 820 176 980 198C1080 212 1160 210 1260 194" fill="none" stroke="#B9C8FF" stroke-width="3" opacity="0.28" stroke-linecap="round"></path>

  <!-- 切线节点 -->
  <circle cx="520" cy="185" r="4" fill="#FFF1B5" opacity="0.9"></circle>
  <circle cx="860" cy="172" r="4" fill="#FFF1B5" opacity="0.9"></circle>
  <circle cx="1050" cy="184" r="4" fill="#D8EDFF" opacity="0.9"></circle>

  <!-- 星点 -->
  <circle cx="360" cy="194" r="2.5" fill="#FFFFFF" opacity="0.75" filter="url(#softGlow)"></circle>
  <circle cx="720" cy="184" r="3" fill="#FFF1B5" opacity="0.72" filter="url(#softGlow)"></circle>
  <circle cx="1180" cy="176" r="2.5" fill="#FFDCE8" opacity="0.72" filter="url(#softGlow)"></circle>

  <!-- 右侧小花 -->
  <circle cx="1388" cy="220" r="8" fill="#FFF2C7"></circle>
  <circle cx="1380" cy="225" r="5" fill="#FFD8E6"></circle>
  <circle cx="1396" cy="225" r="5" fill="#FFD8E6"></circle>
  <circle cx="1388" cy="230" r="3.5" fill="#FFE59A"></circle>

  <circle cx="1432" cy="214" r="7" fill="#FFF1D0"></circle>
  <circle cx="1426" cy="219" r="4" fill="#FFDCE8"></circle>
  <circle cx="1438" cy="219" r="4" fill="#FFDCE8"></circle>
  <circle cx="1432" cy="223" r="3" fill="#FFE59A"></circle>

  <!-- 右侧草丛 -->
  <circle cx="1314" cy="230" r="14" fill="#C9EAD1"></circle>
  <circle cx="1330" cy="236" r="9" fill="#B9E0C0"></circle>

  <!-- 右侧三角尺 -->
  <polygon points="1478,222 1532,222 1496,186" fill="none" stroke="url(#toolGold)" stroke-width="6" opacity="0.72" stroke-linejoin="round"></polygon>
  <polygon points="1498,214 1514,214 1502,202" fill="none" stroke="#F1D38A" stroke-width="3" opacity="0.5" stroke-linejoin="round"></polygon>

  <!-- 小旗标记（探险感） -->
  <path d="M1548 220L1548 176" stroke="#E9C97A" stroke-width="4" stroke-linecap="round" opacity="0.7"></path>
  <path d="M1548 178C1560 178 1568 182 1576 188C1568 194 1560 198 1548 198Z" fill="#FFDFA4" opacity="0.75"></path>

</svg>