<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Geometry Studio - Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="doc_page">
  <div class="doc_container">
    <div class="doc_top_bar"></div>
    <div class="doc_layout">
      <aside class="doc_sidebar">
        <a href="index.html" class="doc_nav_item">Home / 首页</a>
        <a href="game.html" class="doc_nav_item">Game / 游戏</a>
        <a href="quiz.html" class="doc_nav_item active">Quiz / 测验</a>
        <button id="toggle_lang" class="doc_nav_item" type="button"><span id="lang_label">中文</span></button>
        <button id="toggle_mode" class="doc_nav_item" type="button"><span id="mode_label">白天</span></button>
      </aside>

      <article class="doc_main">
        <div class="page_main" style="margin: 0; width: 100%;">
          <section class="hero">
            <div>
              <h1>Quiz Route</h1>
              <p>从基础概念到公式应用，逐级确认你对圆几何的掌握情况。</p>
            </div>
            <div class="hero_media">
              <img src="../images/hero_x.svg" alt="quiz visual" />
            </div>
          </section>

          <section class="quiz_card">
            <h3>分级测验（3 题）</h3>
            <div class="form_grid">
              <label>1) 切线与过切点半径的关系是：</label>
              <label><input type="radio" name="q1" value="a" /> 平行</label>
              <label><input type="radio" name="q1" value="b" /> 垂直</label>
              <label><input type="radio" name="q1" value="c" /> 相交但不垂直</label>

              <label>2) 同弧所对圆周角：</label>
              <label><input type="radio" name="q2" value="a" /> 相等</label>
              <label><input type="radio" name="q2" value="b" /> 不一定相等</label>

              <label for="q3">3) 若半径变为原来 2 倍，面积变为原来几倍？</label>
              <input id="q3" type="number" min="1" max="10" placeholder="请输入数字" />

              <button id="submit_quiz" class="btn btn_secondary" type="button">提交并评分</button>
              <p id="quiz_result"></p>
            </div>
          </section>
        </div>

        <footer class="page_footer">
          完成后可回到首页继续规则轮播复习。
        </footer>
      </article>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
