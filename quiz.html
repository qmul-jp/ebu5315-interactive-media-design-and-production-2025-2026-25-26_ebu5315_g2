<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Geometry Studio - Quiz</title>
  <link rel="stylesheet" href="styles/template.css" />
  <link rel="stylesheet" href="styles/quiz.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">◎</div>
        <div class="brand-title">CirCleLearning</div>
      </div>
      
      <nav class="nav-links">
        <a href="index.html" data-zh="🏠 首页" data-en="🏠 Home">🏠 首页</a>
        <a href="game.html" data-zh="🎮 游戏" data-en="🎮 Game">🎮 游戏</a>
        <a href="quiz.html" class="active" data-zh="📝 测验" data-en="📝 Quiz">📝 测验</a>
      </nav>

      <div class="header-actions">
        <button id="toggle_lang" class="btn-lang">En/Ch</button>
        <button id="toggle_mode" class="btn-mode">🌙</button>
      </div>
    </header>

    <!-- Main Content -->
    <article class="quiz-content">
      <div class="quiz-box card">
        <h1 data-zh="📝 圆几何测验" data-en="📝 Circle Geometry Quiz">📝 圆几何测验</h1>
        
        <div class="quiz-level-section">
          <h2 id="level" data-zh="难度：简单" data-en="Level: Easy">Level: Easy</h2>
          <div class="difficulty-selector">
            <button id="easyBtn" class="difficulty-btn active" data-level="easy" data-zh="😊 简单" data-en="😊 Easy">😊 简单</button>
            <button id="mediumBtn" class="difficulty-btn" data-level="medium" data-zh="🤔 中等" data-en="🤔 Medium">🤔 中等</button>
            <button id="hardBtn" class="difficulty-btn" data-level="hard" data-zh="😈 困难" data-en="😈 Hard">😈 困难</button>
          </div>
        </div>

        <div class="quiz-progress">
          <div class="progress-info">
            <span id="questionNumber" data-zh="问题 1/10" data-en="Question 1/10">问题 1/10</span>
            <span id="currentScoreDisplay" data-zh="得分: 0" data-en="Score: 0">得分: 0</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="quizProgressFill"></div>
          </div>
        </div>

        <div class="question-card">
          <h3 id="question">Question here</h3>
        </div>

        <div id="answers" class="answers-grid"></div>

        <div class="quiz-actions">
          <button id="submitBtn" onclick="submitAnswer()" class="btn btn-primary" data-zh="✅ 提交答案" data-en="✅ Submit Answer">✅ 提交答案</button>
          <button id="nextQuestionBtn" onclick="nextQuestion()" class="btn btn-secondary hidden" data-zh="➡️ 下一题" data-en="➡️ Next Question">➡️ 下一题</button>
        </div>

        <div id="feedback" class="quiz-feedback"></div>

        <div id="score" class="score-display"></div>

        <div id="quizResult" class="quiz-result hidden">
          <div class="result-card card card-success">
            <h2 id="resultTitle" data-zh="🎉 测验完成！" data-en="🎉 Quiz Complete!">🎉 测验完成！</h2>
            <div id="resultScoreDisplay" data-zh="🏅 最终得分：0/100" data-en="🏅 Final Score: 0/100">🏅 最终得分：0/100</div>
            <div id="resultGrade" data-zh="评级：" data-en="Grade: ">评级：</div>
            <div id="resultMessage"></div>
            <button id="restartBtn" onclick="restartQuiz()" class="btn btn-primary" data-zh="🔄 重新开始" data-en="🔄 Restart">🔄 重新开始</button>
          </div>
        </div>
      </div>
    </article>

    <!-- Footer -->
    <footer class="footer">
      <p data-zh="© 2024 CirCleLearning. 保留所有权利。" data-en="© 2024 CirCleLearning. All rights reserved.">© 2024 CirCleLearning. All rights reserved.</p>
    </footer>
  </div>
  <script src="assets/app.js"></script>
  <script src="assets/quiz.js"></script>
</body>
</html>
