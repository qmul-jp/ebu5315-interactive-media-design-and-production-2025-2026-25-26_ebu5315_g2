<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Geometry Studio - Quiz</title>
  <link rel="stylesheet" href="styles/template.css" />
  <link rel="stylesheet" href="styles/quiz.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">◎</div>
        <div class="brand-title">CirCleLearning</div>
      </div>
      
      <nav class="nav-links">
        <a href="index.html">🏠 首页</a>
        <a href="game.html">🎮 游戏</a>
        <a href="quiz.html" class="active">📝 测验</a>
      </nav>

      <div class="header-actions">
        <button id="toggle_lang" class="btn-lang">En/Ch</button>
        <button id="toggle_mode" class="btn-mode">🌙</button>
      </div>
    </header>

    <!-- Main Content -->
    <article class="quiz-content">
      <div class="quiz-box card">
        <h1 data-zh="📝 圆几何测验" data-en="📝 Circle Geometry Quiz">📝 圆几何测验</h1>
        
        <div class="quiz-level-section">
          <h2 id="level">Level: Easy</h2>
          <div class="difficulty-selector">
            <button id="easyBtn" class="difficulty-btn active" data-level="easy">😊 简单</button>
            <button id="mediumBtn" class="difficulty-btn" data-level="medium">🤔 中等</button>
            <button id="hardBtn" class="difficulty-btn" data-level="hard">😈 困难</button>
          </div>
        </div>

        <div class="quiz-progress">
          <div class="progress-info">
            <span id="questionNumber">问题 1/10</span>
            <span id="currentScoreDisplay">得分: 0</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="quizProgressFill"></div>
          </div>
        </div>

        <div class="question-card">
          <h3 id="question">Question here</h3>
        </div>

        <div id="answers" class="answers-grid"></div>

        <div class="quiz-actions">
          <button id="submitBtn" onclick="submitAnswer()" class="btn btn-primary">✅ 提交答案</button>
          <button id="nextQuestionBtn" onclick="nextQuestion()" class="btn btn-secondary hidden">➡️ 下一题</button>
        </div>

        <div id="feedback" class="quiz-feedback"></div>

        <div id="score" class="score-display"></div>

        <div id="quizResult" class="quiz-result hidden">
          <div class="result-card card card-success">
            <h2 id="resultTitle">🎉 测验完成！</h2>
            <div id="resultScoreDisplay">🏅 最终得分：0/100</div>
            <div id="resultGrade">评级：</div>
            <div id="resultMessage"></div>
            <button id="restartBtn" onclick="restartQuiz()" class="btn btn-primary">🔄 重新开始</button>
          </div>
        </div>
      </div>
    </article>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2024 CirCleLearning. All rights reserved.</p>
    </footer>
  </div>
  <script src="assets/app.js"></script>
  <script src="assets/quiz.js"></script>
</body>
</html>
